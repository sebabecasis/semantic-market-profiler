[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-market-profiler"
version = "0.1.0"
description = "Operator-controlled semantic profiling from source plan to evidence-backed qualification."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
semantic-profiler = "semantic_market_profiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
